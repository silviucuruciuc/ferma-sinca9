# Planul terenului — Ferma Șinca 9 (Șinca Nouă, jud. Brașov, ~700 m)
#
# CONTURUL E EXACT. Punctele vin din „Calculul suprafețelor” și din Anexa Nr. 1 la Partea I
# pentru CF 105881 și CF 105882 (Șinca Nouă), proiecția Stereo 70. Verificate prin recalcul:
# pe parcele separate ies 1199.510 și 1000.112 mp, perimetre 151.718 și 145.596 m — identice
# cu actele. Documentele: `cadastru/` (ignorat de git; repo-ul e public).
#
# Cele două parcele sunt un singur contur — hotarul dintre ele (latura 200-201) nu se afișează.
#
# X = Nord, Y = Est, metri. Plan local: x = Y - origine.y (Est), y = X - origine.x (Nord).
# Originea e colțul de sud-vest al gabaritului (X minim = pct. 202, Y minim = pct. 206).
# NU schimba originea după ce ai așezat pomii — pozițiile din pozitii.json sunt metri față de ea.
#
# Terenul e rotit ~12.6° față de axele N/E. Construcțiile sunt aliniate
# la garduri, nu la axele N/E, și calculate din cotele date — nu desenate de mână.
nume: Ferma Șinca 9
localitate: Șinca Nouă, jud. Brașov
sistem: stereo70
origine_stereo70:
  x: 465821.361
  y: 519119.835
parcele:
  - nume: CF 105881 + 105882
    suprafata_mp: 2200
    # Front total la stradă (vest) 41.41 m · adâncime 52.32–54.31 m.
    # Folosință din acte: 788 mp livadă (417 + 371) + 1412 mp arabil (783 + 629).
    puncte: |
      465842.558 519179.725
      465821.361 519170.877
      465822.206 519167.330
      465824.001 519159.392
      465828.494 519139.263
      465832.831 519119.835
      465839.147 519121.709
      465851.330 519126.142
      465854.264 519127.283
      465869.321 519133.138
      465871.738 519133.964
      465859.944 519186.982
# Spaliere (pomi palisați). Se adaugă din Admin → „Plan și poziții” → Spaliere,
# sau aici. Lungimea rândului NU se desenează — iese din constrângere:
#
#     lungime = 2 x margine_m + (nr. pomi - 1) x distanta_m
#
# Punctele dau doar PUNCTUL DE START și DIRECȚIA; linia se întinde sau se scurtează
# singură la lungimea rezultată. Pozițiile pomilor se calculează de aici, nu din
# pozitii.json, și nu se pot trage cu mouse-ul — muți rândul mutând punctele.
# Dacă lași `distanta_m` gol, se împarte linia desenată în pași egali.
#
# spaliere:
#   - nume: Spalier meri (M26)
#     pomi: [mar-14, mar-15, mar-16, mar-17, mar-18]
#     distanta_m: 3.5      # distanța de plantare a portaltoiului
#     margine_m: 1.5       # de la stâlpul de capăt până la primul pom
#     adancime_m: 0.6      # cât iese coroana în lateral față de sârmă
#     puncte: |
#       465833.361 519153.835
#       465850.861 519153.835
spaliere:
  # Rând de la magazie spre gardul de nord, PARALEL cu gardul estic (202-201-210, drept
  # pe toată lungimea: segmentele diferă cu 0.01°), la 1,5 m constant de el.
  # 9 pomi x 3,5 m + 2 x 0,5 margine = linie de 29,00 m. Capătul de sud e ancorat la 2 m
  # de magazie; fiind mai scurt decât coridorul, capătul de nord rămâne la 5,2 m de gard.
  # Al zecelea pom palisat (par-16) e nepoziționat — mută-l aici schimbând lista.
  # Ordinea pe rând: merii dinspre magazie, perii spre gardul de nord.
  - nume: Spalier magazie–gard nord
    pomi: [mar-14, mar-15, mar-16, mar-17, mar-18, par-12, par-13, par-14, par-15]
    distanta_m: 3.5
    margine_m: 0.5
    adancime_m: 0.6
    puncte: |
      465828.623 519172.281
      465855.384 519183.455
zone:
  # Strada urmărește hotarul real de vest (pct. 206-207-208-200-213-209), lățime ~7 m.
  - nume: Stradă
    tip: drum
    puncte: |
      465832.831 519119.835
      465839.147 519121.709
      465851.330 519126.142
      465854.264 519127.283
      465869.321 519133.138
      465871.738 519133.964
      465871.738 519126.964
      465869.321 519126.138
      465854.264 519120.283
      465851.330 519119.142
      465839.147 519114.709
      465832.831 519112.835
  # Bandă de la stradă, pe toată lățimea, până acoperă cei 788 mp de livadă din acte.
  # Adâncime rezultată: 21.60 m din cei 59.60 m ai terenului.
  - nume: Livadă
    tip: livada
    puncte: |
      465828.124 519140.920
      465828.494 519139.263
      465832.831 519119.835
      465839.147 519121.709
      465851.330 519126.142
      465854.264 519127.283
      465869.321 519133.138
      465871.738 519133.964
      465868.195 519149.892
  # Rulotă 3 x 1.5 m, la marginea de nord. Latura lungă (3 m) e spre stradă, deci ocupă
  # 1.5 m în adâncime. La 2 m de gardul nordic (209-210) și la 1 m după capătul livezii
  # (livada se termină la 21.60 m, rulota începe la 22.61 m).
  - nume: Knaus
    tip: constructie
    puncte: |
      465866.025 519150.434
      465865.700 519151.898
      465862.771 519151.247
      465863.097 519149.783
  # Magazie 3.3 x 2.7 m, în colțul de sud (pct. 202). Latura lungă (3.3 m) e paralelă cu
  # gardul estic (202-201), la 0.5 m de el; la 2 m de gardul sudic (203-202).
  - nume: Magazie
    tip: constructie
    puncte: |
      465823.348 519171.165
      465826.394 519172.436
      465827.434 519169.944
      465824.388 519168.673
  # Compost 1 x 1 m, în colțul de vest (pct. 206): 2 m de gardul de vest (206-207)
  # și 1 m de cel de sud (206-205). Colțul are 86.1°, nu 90°, deci latura nu poate fi
  # paralelă cu ambele garduri — pătratul e aliniat la gardul de sud, iar distanțele
  # cerute sunt respectate ca minim (vest 2.00-3.07 m, sud 1.00-2.00 m).
  - nume: Compost
    tip: compost
    puncte: |
      465833.340 519122.144
      465833.122 519123.120
      465834.098 519123.338
      465834.316 519122.362
  # Poarta: 4 m de gard pe latura 200-213, între cei doi liliaci (liliac-01, liliac-02) —
  # centrul e mijlocul proiecțiilor lor pe gard, la 5.43 m după pct. 200 spre 213.
  # Prima variantă o centra pe pct. 200, cu ~5 m prea la sud. Accesul (pietonal și auto)
  # intră de aici perpendicular pe gard.
  - nume: Poartă
    tip: poarta
    puncte: |
      465857.460 519128.526
      465861.188 519129.976
  # Apă rețea 1 x 1 m, în colțul nordic de la stradă (pct. 209), la 0.5 m de gardul de la
  # stradă (213-209) și de cel nordic (209-210). Colțul are 96.3°, nu 90°, deci pătratul e
  # aliniat la gardul de la stradă (0.50 m exact); față de gardul nordic 0.50 m e minimul
  # (0.50-0.61 m), în colțul cel mai apropiat.
  - nume: Apă Rețea
    tip: apa
    puncte: |
      465871.153 519134.292
      465870.206 519133.969
      465869.883 519134.915
      465870.829 519135.239
