# Planul terenului — Ferma Șinca 9 (Șinca Nouă, jud. Brașov, ~700 m)
#
# CONTURUL E EXACT. Punctele vin din „Calculul suprafețelor” și din Anexa Nr. 1 la Partea I
# pentru CF 105881 și CF 105882 (Șinca Nouă), proiecția Stereo 70. Verificate prin recalcul:
# pe parcele separate ies 1199.510 și 1000.112 mp, perimetre 151.718 și 145.596 m — identice
# cu actele. Documentele: `cadastru/` (ignorat de git; repo-ul e public).
#
# Cele două parcele sunt un singur contur — hotarul dintre ele (latura 200-201) nu se afișează.
#
# X = Nord, Y = Est, metri. Plan local: x = Y - origine.y (Est), y = X - origine.x (Nord).
# Originea e colțul de sud-vest al gabaritului (X minim = pct. 202, Y minim = pct. 206).
# NU schimba originea după ce ai așezat pomii — pozițiile din pozitii.json sunt metri față de ea.
#
# Terenul e rotit ~12.6° față de axele N/E. Construcțiile sunt aliniate
# la garduri, nu la axele N/E, și calculate din cotele date — nu desenate de mână.
