  # paralelă cu ambele garduri — pătratul e aliniat la gardul de sud, iar distanțele
  # cerute sunt respectate ca minim (vest 2.00-3.07 m, sud 1.00-2.00 m).
  - nume: Compost
    tip: compost
    puncte: |
      465833.340 519122.144
      465833.122 519123.120
      465834.098 519123.338
      465834.316 519122.362
  # Poarta: 4 m de gard, centrată pe pct. 200. Gardul e coliniar prin 200
  # (208-200 și 200-213 diferă cu 0.002°), deci segmentul cade exact pe hotar.
  - nume: Poartă
    tip: poarta
    puncte: |
      465852.400 519126.558
      465856.128 519128.008
