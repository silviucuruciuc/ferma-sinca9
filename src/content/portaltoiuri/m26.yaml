nume: M26
specii:
  - mar
vigoare: Semi-pitic (cam 40–50%)
talie: ~3 m
tutorare: Tutore permanent sau spalier — rădăcinile sunt casante
distante: ~3,5 m; potrivit pentru palmetă
sol: Sol fertil, reavăn; are nevoie de udare pe secetă
precocitate: Rodește din anul 2–3
rezumat: >-
  Portaltoi semi-pitic, rezistent la ger, bun pentru forme aplatizate pe spalier. Atenție: portaltoiul în sine
  e sensibil la focul bacterian, care e deja prezent în livadă (părul Clapp) — urmărește atent merii pe M26 în
  mai–iunie.
