nume: Gutui A
specii:
  - par
  - mosmon
vigoare: Reduce talia părului (semi-pitic spre mijlociu)
talie: 3–4 m
tutorare: Tutore permanent sau spalier
distante: ~3,5 m; potrivit pentru palmetă
sol: Sol fertil, fără exces de calcar (altfel apare cloroza)
precocitate: Rodește din anul 3
rezumat: >-
  Grăbește intrarea pe rod și ține părul mic — ideal pentru rândul pe spalier. Rădăcinile sunt mai sensibile
  la ger decât ale francului, așa că mulcește bine baza în primele ierni la 700 m.
