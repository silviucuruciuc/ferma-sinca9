nume: M106
specii:
  - mar
vigoare: Semiviguros (cam 65–75% din vigoarea unui franc)
talie: 4–5 m
tutorare: Tutore în primii 2–3 ani; apoi se ancorează singur
distante: ~4,5 m între pomi (ca în planul tău)
sol: Majoritatea solurilor; evită locurile unde băltește apa
precocitate: Intră pe rod în anul 3–4
rezumat: >-
  Portaltoiul clasic pentru livada familială: pom de talie medie, precoce, rezistent la păduchele lânos.
  Punctul slab e putregaiul coletului (Phytophthora) pe soluri grele și umede.
pepiniera_url: https://pepinierele-roman.ro/eticheta-produs/m-106/
