nume: Colt
specii:
  - cires
  - visin
vigoare: Semiviguros
talie: 5–6 m
tutorare: La plantare
distante: 5–6 m
sol: Suportă soluri mai grele și reavăne; nu iubește seceta
precocitate: Medie
rezumat: >-
  Portaltoi englez pentru cireș: pomi ceva mai mici decât pe franc, cu înrădăcinare bună. Sensibil la seceta
  prelungită și la tumorile bacteriene (Agrobacterium) — evită rănirea rădăcinilor.
