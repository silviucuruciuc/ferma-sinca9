nume: Mahaleb (Prunus mahaleb)
specii:
  - cires
  - visin
vigoare: Viguros
talie: 5–6 m și peste
tutorare: La plantare
distante: 5–6 m
sol: Excelent pe soluri uscate, calcaroase, bine drenate; nu suportă apa stagnantă
precocitate: Medie
rezumat: >-
  Vișinul turcesc: portaltoi rustic, rezistent la secetă și ger, cu rădăcini adânci. Pune-l pe locurile cele
  mai bine drenate.
