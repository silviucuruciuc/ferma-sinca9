nume: Mirobolan (corcoduș)
specii:
  - prun
  - cais
vigoare: Viguros
talie: 4–6 m
tutorare: La plantare
distante: ~4,5 m (ca în planul tău)
sol: Foarte adaptabil, inclusiv la soluri grele și umede
precocitate: Medie
rezumat: >-
  Portaltoiul standard pentru prun și cais: rustic, cu rădăcini puternice. Dă drajoni (lăstari din rădăcină) —
  taie-i de la bază cât sunt mici.
