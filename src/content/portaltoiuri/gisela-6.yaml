nume: Gisela 6
specii:
  - cires
vigoare: Semi-pitic
talie: 3–3,5 m
tutorare: Tutore recomandat
distante: ~4 m (ca în planul tău)
sol: Sol fertil; udare pe secetă
precocitate: Foarte precoce (anul 2–3)
rezumat: >-
  Portaltoi german care face cireși mici și foarte productivi. Tinde să se supraîncarce cu rod — rărește prin
  tăieri, altfel fructele rămân mici.
