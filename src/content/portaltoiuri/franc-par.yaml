nume: Franc (Pyrus pyraster)
specii:
  - par
vigoare: Viguros
talie: 5–8 m
tutorare: Doar la plantare; ancorare foarte bună (rădăcină pivotantă)
distante: ~5–6 m
sol: Tolerează seceta și solurile grele sau calcaroase
precocitate: Intră pe rod târziu (anul 5–7)
rezumat: >-
  Păr sălbatic folosit ca portaltoi: pomi mari și longevivi, rezistenți la ger și secetă, compatibili cu toate
  soiurile. Prețul: rod mai târziu și recoltare de pe scară.
