note: -30 °C, rapăn + foc ✓✓
rezumat: >-
  Soi de iarnă foarte rezistent, originar din spațiul ex-sovietic. Vigoare mijlocie, coroană piramidală,
  aerisită. Precoce (rodește din anul 3) și fără alternanță de rodire. Parțial autofertil, dar leagă mult mai
  bine lângă Clapp sau Conference — ambii sunt deja plantați.
