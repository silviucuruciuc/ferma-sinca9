note: Autosteril
rezumat: >-
  Vigoare mijlocie; rodește pe țepușe și burse. Autosteril — Napoca, din livadă, e unul dintre polenizatorii
  recomandați. Fructe alungite, 160–180 g (până la 250 g), galben-verzui cu obraz roșu aprins; pulpa albă,
  crocantă, devine fondantă la coacerea deplină. Se consumă până la începutul lui octombrie.
