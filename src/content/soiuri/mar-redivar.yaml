nume: Redivar
specie: mar
coacere: 25 aug – 15 sep
utilizare: Masă / păstrare
polenizare: necunoscut
note: Imun rapăn ✓
rezumat: >-
  Fructe mari (peste 180–200 g), galben-verzui cu dungi roșu-carmin pe două treimi din suprafață.
  Pulpă crem, crocantă și suculentă, dulce-acrișoară, aromată. Se păstrează foarte bine, până în
  februarie–martie.
pepiniera_url: https://pepinierele-roman.ro/produs/redivar-m-106/
origine: Stațiunea Voinești, omologat în 1999, creat pentru rezistență biologică.
rezistenta: Imun la rapăn (gena Vf), rezistență bună la făinare. Potrivit culturilor cu puține tratamente.
rodire: >-
  Rodire constantă și ridicată; fructifică pe ramuri lungi și scurte. Vigoare mijlocie-mare, coroană
  globuloasă.
recoltare: 25 august – 15 septembrie
pastrare: Foarte bine până în februarie–martie
gust: >-
  Pulpă crem, crocantă, foarte suculentă; gust dulce-acidulat echilibrat, aromă intensă. Fructe mari
  (180–200 g).
sursa: Pepinierele Roman
evaluare:
  gust: 4
  rezistenta: 5
  rodire: 4
  pastrare: 5
