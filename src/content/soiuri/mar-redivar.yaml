nume: Redivar
specie: mar
coacere: 25 aug – 15 sep
utilizare: Masă / păstrare
polenizare: necunoscut
note: Imun rapăn ✓
rezumat: >-
  Fructe mari (peste 180–200 g), galben-verzui cu dungi roșu-carmin pe două treimi din suprafață. Pulpă crem,
  crocantă și suculentă, dulce-acrișoară, aromată. Se păstrează foarte bine, până în februarie–martie.
