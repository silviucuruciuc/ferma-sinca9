nume: Pionier
specie: mar
coacere: 15–30 aug
utilizare: Masă
polenizare: autofertil
polenizatori:
  - Generos
  - Prima
  - Florina
note: Rezistent
rezumat: >-
  Soi românesc (Voinești) creat pentru rezistență genetică la rapăn; rezistă bine și la făinare, deci cere
  puține tratamente. Vigoare mijlocie, coroană globuloasă și rară. Intră pe rod din anul 3 și rodește
  constant. Fructe mijlocii (140–170 g), sferice, uniforme.
