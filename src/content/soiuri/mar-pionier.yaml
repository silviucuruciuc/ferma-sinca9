nume: Pionier
specie: mar
coacere: 15–30 aug
utilizare: Masă
polenizare: autofertil
polenizatori:
  - Generos
  - Prima
  - Florina
note: Rezistent
rezumat: >-
  Soi românesc (Voinești) creat pentru rezistență genetică la rapăn; rezistă bine și la făinare,
  deci cere puține tratamente. Vigoare mijlocie, coroană globuloasă și rară. Intră pe rod din anul 3
  și rodește constant. Fructe mijlocii (140–170 g), sferice, uniforme.
pepiniera_url: https://pepinierele-roman.ro/produs/pionier-m-106/
origine: Soi românesc creat la Voinești.
rezistenta: >-
  Rezistență genetică la rapăn și rezistență bună la făinare. Soi „ecologic”, cere foarte puține
  tratamente.
rodire: Autofertil, foarte productiv și constant, intră pe rod în anul 3 de la plantare, fără alternanță.
recoltare: 15–30 august
pastrare: 2–3 luni în pivniță (până în octombrie)
gust: Pulpă alb-gălbuie, suculentă și crocantă; gust echilibrat dulce-acrișor, cu aromă discretă.
sursa: Pepinierele Roman
evaluare:
  gust: 4
  rezistenta: 5
  rodire: 5
  pastrare: 2
