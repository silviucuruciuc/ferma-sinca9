nume: Andosa
specie: nectarin
coacere: A doua jumătate a lui august
utilizare: Masă / prelucrat
polenizare: autofertil
rezistenta: >-
  Rezistență la ger — sursele diferă: unele îl dau ca „mediu rezistent", altele până la -30 °C.
rodire: Pom viguros, productivitate mare. Autofertil — nu are nevoie de polenizatori. Intră pe rod la 2–3 ani de la plantare.
recoltare: A doua jumătate a lunii august
gust: >-
  Fructe mari (~140 g), roșu aprins. Pulpă galbenă, suculentă, neaderentă la sâmbure — printre
  cele mai bune soiuri pentru comercializare.
sursa: pepiniere românești concordante (Yurta, Sosa, Sweet Garden)
evaluare:
  gust: 4
  rodire: 5
de_verificat: originea, rezistența reală la ger, rezistența la boli
