nume: Cea Mai Bună de Ungaria (CMB)
specie: cais
coacere: Mijlocul lui iulie
utilizare: Masă / prelucrat
polenizare: autofertil
origine: Obținut prin selecție în Ungaria.
rezistenta: Rezistent la condiții climatice dificile.
rodire: >-
  Vigoare mare, coroană puternic ramificată. Productivitate bună și constantă. Autofertil — leagă
  și fără polenizatori, dar rodește mai bine lângă alte soiuri compatibile.
recoltare: Mijlocul lunii iulie
gust: >-
  Fructe medii-mari (45–60 g), ovale, portocaliu intens, uneori cu rumeneală pe partea însorită.
  Pulpă fermă și suculentă, gust dulce-acrișor, aromat.
sursa: Yurta
evaluare:
  gust: 4
  rezistenta: 4
  rodire: 4
de_verificat: anul obținerii, durata de păstrare
