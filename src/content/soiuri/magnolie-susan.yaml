nume: Susan
specie: magnolie
coacere: —
utilizare: Ornamental
polenizare: necunoscut
origine: US National Arboretum, mijlocul anilor 1950, obținută de Francis DeVos și William Kosar din încrucișarea Magnolia liliiflora „Nigra” × Magnolia stellata „Rosea”. Face parte din seria „Little Girl”.
rezistenta: Rezistență la ger până la circa -30 °C.
rodire: >-
  Arbust compact sau pom mic, cu creștere înceată. Înflorește cu 2–4 săptămâni mai târziu decât
  magnoliile clasice, ceea ce scade riscul ca florile să fie prinse de înghețurile târzii de
  primăvară.
gust: — (ornamental)
sursa: US National Arboretum, Missouri Botanical Garden
evaluare:
  rezistenta: 5
note: Flori parfumate, roșu-purpuriu spre fucsia, mai palide în interior; se deschid înainte de frunze.
