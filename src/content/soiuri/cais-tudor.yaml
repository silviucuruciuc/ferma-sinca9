nume: Tudor
specie: cais
coacere: Timpuriu (sfârșit de iunie – început de iulie, în zonele calde)
utilizare: Masă / compot / gem
polenizare: autosteril
polenizatori:
  - Dacia
  - Goldrich
  - Harcot
rezumat: >-
  Soi românesc de cais obținut la SCDP Constanța împreună cu Universitatea Rutgers (Viceroy × NJA 2), omologat
  în 1993. Pom viguros și foarte productiv, dar autosteril. Fructe mijlocii (40–45 g), portocalii cu obraz
  roșu-carmin; pulpă aromată, care se desprinde de sâmbure. Altoit pe mirobolan.
pepiniera_url: https://pepinierele-roman.ro/produs/tudor/
de_verificat: >-
  În inventar apare la PĂR, pe franc. La Pepinierele Roman „Tudor” este soi de CAIS, altoit pe mirobolan —
  verifică pe factură. Fiind autosteril, are nevoie de un alt cais care înflorește odată cu el; caisul negru
  nu e un polenizator sigur.
