nume: Triumf
specie: par
coacere: 15–25 iulie (după pepinieră)
utilizare: Masă
polenizare: necunoscut
rezumat: >-
  Soi românesc (ICDP Pitești, Napoca × Beurré Giffard, omologat în 1983). Vigoare mijlocie, coroană
  piramidală, productiv; rezistent la rapăn și la pătarea albă. Fructe mari, galbene cu roșu pe partea
  însorită, pulpă dulce și fină. Se păstrează 1–2 săptămâni.
pepiniera_url: https://pepinierele-roman.ro/produs/triumf-2/
de_verificat: În inventar apare cu coacere de toamnă; pepiniera îl descrie ca soi de vară (15–25 iulie).
