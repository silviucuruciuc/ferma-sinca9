nume: Harcot
specie: cais
coacere: Mijlocul lui iulie
utilizare: Masă / prelucrat
polenizare: partial
polenizatori:
  - Goldrich
rezistenta: >-
  Rezistent la ger (Zdravăn). Înflorește timpuriu, iar florile pot fi afectate de înghețurile
  târzii (Pepiniera Moara). Rezistent la sharka și la secetă (Sweet Garden).
rodire: >-
  Vigoare mijlocie-mare, coroană ușor divergentă. Foarte roditor, încărcare bună cu rod. Intră pe
  rod din al doilea an de la plantare. Parțial autofertil — rodește corespunzător doar cu
  polenizator.
recoltare: 10–20 iulie
gust: >-
  Fructe mari, galben-portocalii cu roșu pe partea însorită. Pulpă galben-portocalie, suculentă,
  aromată, se desprinde de sâmbure. Mărimea diferă între surse: 35–40 g, 50–55 g sau 60–70 g.
sursa: Yurta (pagina dă 403); date din Zdravăn, Pepiniera Moara, Sweet Garden
evaluare:
  rodire: 4
de_verificat: >-
  originea (Canada sau „America" — sursele nu coincid), mărimea fructului, autofertilitatea
  (Sweet Garden îl dă autofertil, ceilalți parțial), durata de păstrare
