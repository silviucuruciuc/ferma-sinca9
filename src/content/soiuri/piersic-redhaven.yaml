nume: Redhaven
specie: piersic
coacere: 20 iulie – 5 august
utilizare: Masă
polenizare: autofertil
origine: Stația experimentală South Haven, Michigan (SUA), 1940, din încrucișarea Halehaven × Kalhaven.
rezistenta: Unul dintre cele mai rezistente soiuri la ger; toleranță bună la bolile specifice, cu rezistență parțială la băşicarea frunzelor (Taphrina deformans) și la monilioză.
rodire: Vigoare mijlocie-mare, creștere rapidă, coroană globuloasă bine ramificată. Producție mare și constantă, intră repede pe rod — uneori din anul 2 de la plantare.
recoltare: 20 iulie – 5 august; fructele se coc uniform, se pot culege în 2–3 reprize
gust: Pulpă galbenă cu infiltrații roșii lângă sâmbure, fin granulată, suculentă, foarte dulce, cu aromă muscată caracteristică. Fructe mari (150–180 g), sferice, galbene acoperite cu roșu aprins pe partea însorită.
sursa: pepiniere românești (Yurta, Pepinierele Roman, SCDP Băneasa) — concordante
evaluare:
  gust: 5
  rezistenta: 4
  rodire: 5
de_verificat: durata de păstrare
rezumat: >-
  Cel mai cunoscut soi de piersic din lume și reperul după care se compară epocile de coacere ale
  celorlalte soiuri.
